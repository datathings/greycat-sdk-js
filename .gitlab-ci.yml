default:
  tags: [linux]

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"

stages:
  - build
  - publish

before_script:
  - export VERSION=`git2version -s`

# This folder is cached between builds
# https://docs.gitlab.com/ee/ci/yaml/index.html#cache
cache:
  paths:
    - node_modules/

build:
  stage: build
  script:
    - ./build.sh
  artifacts:
    when: on_success
    paths:
      - dist

publish:
  stage: publish
  when: manual
  script:
    - ./publish.sh
  artifacts:
    paths:
      - dist

